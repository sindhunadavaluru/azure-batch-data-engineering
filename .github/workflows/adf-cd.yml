name: ADF CD Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm deployment templates
        run: |
          test -f batchdatafactory11/ARMTemplateForFactory.json
          test -f batchdatafactory11/ARMTemplateParametersForFactory.json
          echo "ADF deployment templates found."
