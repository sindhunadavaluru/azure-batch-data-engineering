name: ADF CD Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ADF published templates
        uses: actions/checkout@v4
        with:
          ref: adf_publish
          path: adf-published

      - name: Confirm deployment templates
        run: |
          test -f adf-published/batchdatafactory11/ARMTemplateForFactory.json
          test -f adf-published/batchdatafactory11/ARMTemplateParametersForFactory.json
          echo "ADF deployment templates found."
