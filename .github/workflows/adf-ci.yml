name: ADF CI Validation

on:
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - 'dataset/**'
      - 'linkedService/**'
      - 'factory/**'
      - '.github/workflows/adf-ci.yml'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ADF source folders
        run: |
          test -d pipeline
          test -d dataset
          test -d linkedService
          test -d factory
          echo "ADF source folders found."

      - name: Validate ADF JSON files
        run: |
          find pipeline dataset linkedService factory -type f -name '*.json' -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null
          done
          echo "ADF JSON syntax validation passed."
