name: ADF CI Validation

on:
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - 'dataset/**'
      - 'linkedService/**'
      - 'factory/**'
      - '.github/workflows/adf-ci.yml'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ADF source files
        run: |
          test -d pipeline
          test -d dataset
          test -d linkedService
          test -d factory
          echo "ADF source folders found successfully."
